name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deux fusions rapprochées se disputeraient le commit final de compose.yaml : on sérialise
# sans jamais interrompre un build en cours.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Lecture seule par défaut : seul update-compose écrit dans le dépôt.
permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  REGISTRY: registry.kiora.tech
  IMAGE_PREFIX: kiora/secretshare_

jobs:
  test:
    name: Quality and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: secretshare
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/secretshare?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, ctype, iconv
          coverage: none

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}

      - run: composer install --no-progress --no-interaction
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction
      - run: vendor/bin/phpunit --testdox

  prepare-build:
    name: Prepare build
    needs: test
    # Seule la branche main publie des images : une branche ne peut pas écrire les tags de la prod.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - id: version
        env:
          SHA: ${{ github.sha }}
        run: echo "version=$(date +%Y%m%d)-${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Production environment
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^APP_ENV=.*/APP_ENV=prod/" .env
          echo "APP_VERSION=${VERSION}" >> .env
          rm -rf var/cache/* var/log/* .env.local .env.*.local compose.override.yaml

      # Dépendances sans les outils de dev, puis les assets versionnés (public/assets/) que
      # nginx sert directement. Le code de chiffrement vient de assets/vendor/, commité :
      # rien n'est retéléchargé d'un CDN ici.
      - name: Dependencies and assets
        run: |
          docker run --rm -v "$PWD":/app -w /app -e APP_ENV=prod -e APP_SECRET=build \
            composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc \
            sh -c "composer install --no-dev --optimize-autoloader --no-scripts --no-interaction \
                   && php bin/console asset-map:compile"
          test -f public/assets/manifest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1

  build-and-push:
    name: Build and push images
    needs: prepare-build
    runs-on: ubuntu-latest
    # Les secrets du registre vivent dans l'environnement production, limité à la branche main.
    environment: production
    outputs:
      php: ${{ steps.php.outputs.digest }}
      nginx: ${{ steps.nginx.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: .

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Pas de cache de couches : le job de test exécute du code tiers et pourrait l'écrire.
      - name: Push PHP image
        id: php
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}php:${{ needs.prepare-build.outputs.version }}

      - name: Push nginx image
        id: nginx
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/nginx/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}nginx:${{ needs.prepare-build.outputs.version }}

      # Essai de démarrage sur les images poussées elles-mêmes, par leur empreinte : ce qui est
      # testé est exactement ce que compose.yaml épinglera.
      - name: Smoke test (amd64, pushed images)
        env:
          PHP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}php@${{ steps.php.outputs.digest }}
          NGINX_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}nginx@${{ steps.nginx.outputs.digest }}
        run: |
          docker network create smoke
          docker run -d --name php --network smoke -e APP_SECRET=smoke-secret-at-least-32-bytes-long \
            -e DATABASE_URL="postgresql://x:x@127.0.0.1:1/x?serverVersion=16" "$PHP_IMAGE"
          docker run -d --name nginx --network smoke -p 8080:80 "$NGINX_IMAGE"
          sleep 5
          curl -fsS http://localhost:8080/ | grep -q 'Share a secret'
          curl -fsSI http://localhost:8080/ | grep -qi 'content-security-policy'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/status)" = 404

  update-compose:
    name: Pin the new version in compose.yaml
    needs: [prepare-build, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - env:
          VERSION: ${{ needs.prepare-build.outputs.version }}
          PHP_DIGEST: ${{ needs.build-and-push.outputs.php }}
          NGINX_DIGEST: ${{ needs.build-and-push.outputs.nginx }}
        run: |
          # Tag et empreinte : Swarm exécute l'image construite ici, même si le tag était réécrit.
          sed -i "s|\(registry\.kiora\.tech/kiora/secretshare_php:\)[^ ]*|\1${VERSION}@${PHP_DIGEST}|; s|\(registry\.kiora\.tech/kiora/secretshare_nginx:\)[^ ]*|\1${VERSION}@${NGINX_DIGEST}|" compose.yaml
          grep -c "@sha256:" compose.yaml | grep -qx 4
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add compose.yaml
          git diff --staged --quiet || git commit -m "chore: compose.yaml en version ${VERSION}"
          git pull --rebase origin main
          git push
