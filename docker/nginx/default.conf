server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Aucun journal d'accès : chaque URL de secret porte son identifiant.
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Un secret pèse au plus ~14 Mo une fois chiffré et encodé (10 Mio de fichiers).
    client_max_body_size 16m;
    client_body_buffer_size 1m;
    server_tokens off;

    # Une seule adresse : www renvoie vers l'apex (NPM transmet l'en-tête Host d'origine).
    if ($host = "www.secretshare.co") {
        return 301 https://secretshare.co$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

    include /etc/nginx/snippets/security-headers.conf;

    # Assets compilés par AssetMapper : nom versionné, donc en cache pour un an.
    # En développement ils n'existent pas sur disque et Symfony les sert.
    location /assets/ {
        try_files $uri /index.php$is_args$args;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Sonde de santé de nginx lui-même : elle ne dépend pas de php (dont la sonde est à part).
    location = /healthz {
        access_log off;
        return 204;
    }

    # nginx ne connaît pas l'extension .webmanifest : sans ce type, le fichier part en octet-stream.
    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
