# Inclus dans chaque location : un add_header déclaré dans une location efface ceux du
# niveau serveur. La CSP n'est pas ici : Symfony la pose avec un nonce par requête.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# Ni l'URL d'un secret ni rien d'autre ne part vers un site tiers.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
