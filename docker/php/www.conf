[www]
user = symfony
group = symfony
listen = 9000
listen.backlog = 511

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 60s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; La page d'état ne répond que sur 127.0.0.1:9001, dans un pool à part : la sonde de santé
; (php-fpm-healthcheck, FCGI_CONNECT=localhost:9001) n'attend pas un worker libre, et nginx
; ne peut pas la router vers l'extérieur.
pm.status_path = /status
pm.status_listen = 127.0.0.1:9001

; Pas de journal d'accès : chaque URL de secret porte son identifiant. L'image php:fpm en
; ouvre un dans php-fpm.d/docker.conf, qu'on remplace ici.
access.log = /dev/null
