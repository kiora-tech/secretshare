framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict
        # Pas de polyfill es-module-shims chargé depuis un CDN : la CSP n'autorise que notre
        # origine, et tous les navigateurs actuels gèrent les importmaps.
        importmap_polyfill: false

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
